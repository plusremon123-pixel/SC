    .page-subtitle { font-size: 16px; font-weight: 600; fill: #5b6472; }
    .unit-header { font-size: 17px; font-weight: 700; }
    .unit-name { font-size: 16px; font-weight: 700; }
    .image-placeholder { fill: #d9d9dc; stroke: #c6c9ce; stroke-width: 1; }
