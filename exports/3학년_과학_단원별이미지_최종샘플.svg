  <title id="svg-title">3학년 과학 단원별 이미지 최종 샘플</title>
  <desc id="svg-desc">확정 배치와 파일명 규칙을 적용한 Figma 편집용 SVG 샘플</desc>
  <style>
    text { font-family: 'NanumGothic', sans-serif; fill: #111111; letter-spacing: 0; }
